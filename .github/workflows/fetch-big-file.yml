name: Fetch big model file
# The heb.traineddata model (3.7 MB) is too big for the uploader used to back up this site,
# so this one-time workflow copies it from the live site, checks its SHA-256 and commits it.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/fetch-big-file.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download heb.traineddata if missing
        run: |
          set -e
          if [ -f tessdata/heb.traineddata ]; then echo "already here"; exit 0; fi
          curl -fsSL -o tessdata/heb.traineddata https://hebrew-ocr.sites.tab.bot/tessdata/heb.traineddata
          echo "dbaa827aea6bc21215638447f17783a1004987c2d0bf5573d111fee397abdae5  tessdata/heb.traineddata" | sha256sum -c -
          git config user.name "boro11204"
          git config user.email "boro11204@users.noreply.github.com"
          git add tessdata/heb.traineddata
          git commit -m "Add tessdata/heb.traineddata (Google tessdata_best Hebrew, Apache-2.0)"
          git push
